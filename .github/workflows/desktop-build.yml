# Reusable: builds the Windows installers (NSIS .exe + .msi) and optionally
# publishes them. Called by desktop-ci.yml (build check) and
# desktop-release.yml (tagged release).
#
# Two jobs (BUG-20): `ci` builds without any secret (unsigned, no updater
# artifacts); `release` is the only job that sees the signing key and the
# release token - they live in the `release` environment, which only allows
# desktop-v* / android-v* tags and needs a reviewer's approval (docs/DESKTOP.md).
# Signing happens inside `tauri build`, so the whole release build runs in the
# protected job; unsigned files are never handed from one job to the other.
name: Desktop build (reusable)

on:
  workflow_call:
    inputs:
      publish:
        description: Create a GitHub Release and register it with the Basework server
        type: boolean
        default: false
      version:
        description: Release version (without "v"); required when publish is true
        type: string
        default: ""
      channel:
        description: Release channel registered with the server (stable or beta)
        type: string
        default: stable

jobs:
  ci:
    if: ${{ !inputs.publish }}
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      # Public origin of the web app (repository variable, not a secret). A CI build is only a
      # compile check; runs that can't read variables (Dependabot, forks) use a placeholder that
      # can never resolve. The release job has no fallback.
      BASEWORK_SERVER_URL: ${{ vars.BASEWORK_SERVER_URL || 'https://example.invalid' }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri -> target

      - run: npm ci

      - name: Rust tests (navigation policy)
        working-directory: desktop/src-tauri
        run: |
          node ../scripts/prepare-shell.mjs
          cargo test --locked

      # No signing key here: a CI build is never signed (and never auto-updates).
      - name: Build installers (unsigned)
        run: npm run build

      - name: Collect installers
        id: files
        run: |
          nsis=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          msi=$(ls src-tauri/target/release/bundle/msi/*.msi | head -1)
          echo "nsis=desktop/$nsis" >> "$GITHUB_OUTPUT"
          echo "msi=desktop/$msi" >> "$GITHUB_OUTPUT"
          ls -la src-tauri/target/release/bundle/nsis src-tauri/target/release/bundle/msi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: basework-desktop-windows-unsigned
          path: |
            ${{ steps.files.outputs.nsis }}
            ${{ steps.files.outputs.msi }}
          if-no-files-found: error
          retention-days: 7

  release:
    if: ${{ inputs.publish }}
    runs-on: windows-latest
    # Secrets come from this environment only (tags desktop-v* / android-v*, reviewer approval).
    environment: release
    permissions:
      contents: write
    env:
      # Required: prepare-shell.mjs fails the release when it's missing (BUG-16).
      BASEWORK_SERVER_URL: ${{ vars.BASEWORK_SERVER_URL }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No caches in the release job: a poisoned cache must not reach a signed build.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: npm ci

      - name: Check version matches the release tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "$pkg" != "$RELEASE_VERSION" ]; then
            echo "::error::desktop/package.json version ($pkg) != release version ($RELEASE_VERSION). Bump the version first (docs/DESKTOP.md)."
            exit 1
          fi

      - name: Refuse to publish over another channel's release
        # A beta run for a version already released as stable (or the other way round) would replace
        # the files stable users download, while the server keeps the other channel's checksum / signature.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: desktop-v${{ inputs.version }}
          WANT_BETA: ${{ inputs.channel == 'beta' }}
        run: |
          existing=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease 2>/dev/null || echo none)
          if [ "$existing" != "none" ] && [ "$existing" != "$WANT_BETA" ]; then
            echo "::error::$TAG is already released on the other channel (prerelease=$existing). Publish a new version number instead."
            exit 1
          fi

      - name: Rust tests (navigation policy)
        working-directory: desktop/src-tauri
        run: |
          node ../scripts/prepare-shell.mjs
          cargo test --locked

      # Authenticode signing (BUG-27): set the release environment variable WINDOWS_SIGN_COMMAND to the
      # signing provider's command and add its login step above (docs/DESKTOP.md, Code signing).
      # Tauri signs while bundling, so the updater .sig below is made over the signed installer.
      - name: Build installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          WINDOWS_SIGN_COMMAND: ${{ vars.WINDOWS_SIGN_COMMAND }}
        run: |
          extra=()
          if [ -n "$WINDOWS_SIGN_COMMAND" ]; then
            node scripts/prepare-signing-config.mjs
            extra=(-- --config src-tauri/tauri.signing.generated.json)
          else
            echo "::warning::Installers are not code-signed: WINDOWS_SIGN_COMMAND is not set (docs/DESKTOP.md, Code signing)."
          fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$TAURI_UPDATER_PUBKEY" ]; then
            echo "Auto-update signing enabled"
            npm run build:updater "${extra[@]}"
          else
            echo "::notice::Auto-update signing not configured - building without updater artifacts"
            npm run build "${extra[@]}"
          fi

      - name: Collect installers
        id: files
        run: |
          nsis=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          msi=$(ls src-tauri/target/release/bundle/msi/*.msi | head -1)
          echo "nsis=desktop/$nsis" >> "$GITHUB_OUTPUT"
          echo "nsis_name=$(basename "$nsis")" >> "$GITHUB_OUTPUT"
          echo "msi=desktop/$msi" >> "$GITHUB_OUTPUT"
          sig="$nsis.sig"
          if [ -f "$sig" ]; then echo "sig=desktop/$sig" >> "$GITHUB_OUTPUT"; fi
          ls -la src-tauri/target/release/bundle/nsis src-tauri/target/release/bundle/msi

      - name: Check Authenticode signatures
        if: ${{ vars.WINDOWS_SIGN_COMMAND != '' }}
        shell: pwsh
        working-directory: .
        env:
          NSIS: ${{ steps.files.outputs.nsis }}
          MSI: ${{ steps.files.outputs.msi }}
        run: |
          foreach ($f in @($env:NSIS, $env:MSI)) {
            $s = Get-AuthenticodeSignature $f
            Write-Host "$f : $($s.Status) / $($s.SignerCertificate.Subject) / timestamp: $($s.TimeStamperCertificate.Subject)"
            if ($s.Status -ne 'Valid') { Write-Host "::error::$f signature is $($s.Status)"; exit 1 }
            if ($null -eq $s.TimeStamperCertificate) { Write-Host "::error::$f has no timestamp"; exit 1 }
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: basework-desktop-windows
          path: |
            ${{ steps.files.outputs.nsis }}
            ${{ steps.files.outputs.msi }}
            ${{ steps.files.outputs.sig }}
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: desktop-v${{ inputs.version }}
          name: Basework Desktop v${{ inputs.version }}
          prerelease: ${{ inputs.channel == 'beta' }}
          body: |
            Windows desktop client for Basework. Same account, server and data as the web app.
            - **Basework_…-setup.exe** - per-user install, no admin rights (recommended; used by the web Download button)
            - **.msi** - per-machine install for IT deployment (Intune / GPO)
          files: |
            ${{ steps.files.outputs.nsis }}
            ${{ steps.files.outputs.msi }}
            ${{ steps.files.outputs.sig }}

      - name: Register release with the Basework server
        working-directory: .
        env:
          DESKTOP_RELEASE_TOKEN: ${{ secrets.DESKTOP_RELEASE_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          INSTALLER_PATH: ${{ steps.files.outputs.nsis }}
          INSTALLER_URL: https://github.com/${{ github.repository }}/releases/download/desktop-v${{ inputs.version }}/${{ steps.files.outputs.nsis_name }}
          UPDATER_SIG_PATH: ${{ steps.files.outputs.sig }}
          RELEASE_NOTES: ${{ github.event.head_commit.message || '' }}
        run: |
          if [ -z "$DESKTOP_RELEASE_TOKEN" ]; then
            echo "::warning::DESKTOP_RELEASE_TOKEN secret not set - release uploaded to GitHub but not registered; register it in Admin console → Desktop releases."
            exit 0
          fi
          node scripts/desktop/publish-release.mjs
