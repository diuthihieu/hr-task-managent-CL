# Android app (mobile/android, a Trusted Web Activity around the live site).
# - Pull requests touching the app: `build` makes a debug APK to prove it compiles
#   (artifact, not for users). No secrets, read-only.
# - Tag "android-vX.Y.Z" (or run manually, picking the TAG in "Use workflow from"):
#   `release` builds the signed release APK, attaches it to a GitHub Release and
#   registers it with the server, so the "Get woli on your phone" dialog offers it.
#   Its secrets live in the `release` environment (tags only, reviewer approval -
#   BUG-20): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD, and DESKTOP_RELEASE_TOKEN (same token as desktop releases).
name: Android app

on:
  pull_request:
    paths: ["mobile/android/**", ".github/workflows/android.yml"]
  push:
    tags: ["android-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 1.0.0
        required: true
      channel:
        description: Release channel (beta for a trial release nobody is offered by default)
        type: choice
        options: [stable, beta]
        default: stable

permissions:
  contents: read

# The site the app opens (repository variable, BUG-16): pull-request builds that can't read it
# (Dependabot, forks) use a placeholder; the release job requires it.
env:
  APP_HOST: ${{ vars.ANDROID_APP_HOST }}

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      # Cache kept here: pull-request debug build only (never published); the release job sets cache-disabled.
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4 # zizmor: ignore[cache-poisoning]
        with:
          gradle-version: "8.10.2"

      - name: Build (debug, unsigned)
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          v="0.0.0-pr.$PR_NUMBER"
          APP_HOST="${APP_HOST:-example.invalid}"
          gradle -p mobile/android testDebugUnitTest assembleDebug -PappVersion="$v" -PappHost="$APP_HOST" --no-daemon --stacktrace
          mkdir -p dist
          cp "$(ls mobile/android/app/build/outputs/apk/debug/*.apk | head -1)" "dist/woli-android-$v-debug.apk"
          sha256sum dist/*.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: woli-android-pr-${{ github.event.number }}-debug
          path: dist/*.apk
          retention-days: 7

  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: v
        name: Version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then v="$INPUT_VERSION"; else v="${GITHUB_REF_NAME#android-v}"; fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then echo "::error::Invalid version '$v'"; exit 1; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Refuse to publish over another channel's release
        # A beta run for a version already released as stable (or the other way round) would replace
        # the files stable users download, while the server keeps the other channel's checksum / signature.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-v${{ steps.v.outputs.value }}
          WANT_BETA: ${{ inputs.channel == 'beta' }}
        run: |
          existing=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease 2>/dev/null || echo none)
          if [ "$existing" != "none" ] && [ "$existing" != "$WANT_BETA" ]; then
            echo "::error::$TAG is already released on the other channel (prerelease=$existing). Publish a new version number instead."
            exit 1
          fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      # No Gradle cache in the release job: a poisoned cache must not reach a signed build.
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: "8.10.2"
          cache-disabled: true

      - name: Release host
        run: |
          if [ -z "$APP_HOST" ]; then echo "::error::Repository variable ANDROID_APP_HOST is not set (the site the app opens) - docs/ANDROID.md."; exit 1; fi

      - name: Signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set in the release environment - a release must be signed with the app's key (docs/ANDROID.md)."; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build (release, signed)
        env:
          APP_VERSION: ${{ steps.v.outputs.value }}
          ANDROID_KEYSTORE_PATH: ${{ steps.key.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p mobile/android assembleRelease -PappVersion="$APP_VERSION" -PappHost="$APP_HOST" --no-daemon --stacktrace
          mkdir -p dist
          cp "$(ls mobile/android/app/build/outputs/apk/release/*.apk | head -1)" "dist/woli-android-$APP_VERSION.apk"
          sha256sum dist/*.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs dist/*.apk | grep -i "SHA-256"
          rm -f "$ANDROID_KEYSTORE_PATH"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: woli-android-${{ steps.v.outputs.value }}
          path: dist/*.apk
          retention-days: 14

      - name: GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: android-v${{ steps.v.outputs.value }}
          name: woli Android ${{ steps.v.outputs.value }}
          prerelease: ${{ inputs.channel == 'beta' }}
          files: dist/*.apk

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Register release with the server
        env:
          BASEWORK_SERVER_URL: https://${{ env.APP_HOST }}
          DESKTOP_RELEASE_TOKEN: ${{ secrets.DESKTOP_RELEASE_TOKEN }}
          RELEASE_PLATFORM: android
          RELEASE_CHANNEL: ${{ inputs.channel || 'stable' }}
          RELEASE_VERSION: ${{ steps.v.outputs.value }}
          INSTALLER_PATH: dist/woli-android-${{ steps.v.outputs.value }}.apk
          INSTALLER_URL: https://github.com/${{ github.repository }}/releases/download/android-v${{ steps.v.outputs.value }}/woli-android-${{ steps.v.outputs.value }}.apk
          MIN_OS_VERSION: Android 7.0+
          RELEASE_NOTES: ${{ github.event.head_commit.message || '' }}
        run: |
          if [ -z "$DESKTOP_RELEASE_TOKEN" ]; then
            echo "::warning::DESKTOP_RELEASE_TOKEN secret not set - the APK is on the GitHub Release but not registered; add it in Admin console > Desktop releases (platform android)."
            exit 0
          fi
          node scripts/desktop/publish-release.mjs
