[package]
name = "basework-desktop"
version = "0.1.0"
description = "Basework desktop client (Windows)"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "basework_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Auto-updates: compiled in only with `--features updater` (see docs/DESKTOP.md).
tauri-plugin-updater = { version = "2", optional = true }

[features]
updater = ["dep:tauri-plugin-updater"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
