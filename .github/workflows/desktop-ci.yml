# Builds the Windows installers on every change to the desktop client (no publishing).
name: Desktop CI

on:
  push:
    branches: ["**"]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-*.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-*.yml"

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/desktop-build.yml
    with:
      publish: false
    secrets: inherit
