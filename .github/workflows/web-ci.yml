# Release gate for the web app: every push / PR must lint, type-check, pass unit
# tests, build, validate migrations, pass the HTTP integration suite against a
# throwaway PostgreSQL and pass the browser suite (phone layouts, app shell, service
# worker). Make "Web CI / verify" a required check on the default branch.
name: Web CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["desktop/**", "docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["desktop/**", "docs/**", "**/*.md"]

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: basework
          POSTGRES_PASSWORD: basework
          POSTGRES_DB: basework
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U basework" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://basework:basework@localhost:5432/basework
      DIRECT_URL: postgresql://basework:basework@localhost:5432/basework
      TEST_DATABASE_URL: postgresql://basework:basework@localhost:5432/basework_it
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # New migrations must sort after every migration on the base branch (folders carry future dates).
      - name: Migration names stay in order
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          node scripts/check-migration-order.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fail early on any high / critical advisory in the whole tree (dev included).
      # Low / moderate ones are reported by the weekly audit workflow instead.
      - name: Dependency audit (high and above)
        run: npm audit --audit-level=high
      - run: npx prisma generate
      # Reads of soft-deleted models must filter deletedAt (or say why not) - docs/SOFT-DELETE.md.
      - name: Soft-deleted rows stay filtered
        run: node scripts/check-soft-delete.mjs
      - name: Lint
        run: npx eslint src tests e2e playwright.config.ts --max-warnings=0
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: No circular imports
        run: npx --yes madge@8.0.0 --circular --extensions ts,tsx --ts-config tsconfig.json src
      - name: Unit tests
        run: npm test
      - name: Migrations apply cleanly and match the schema
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Production build
        run: npm run build
        env:
          AUTH_SECRET: ci-only-${{ github.run_id }}-not-a-real-secret-value-xx
      - name: Integration tests
        run: npm run test:integration
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests (phone layouts, app shell, service worker)
        run: npm run test:e2e
        env:
          AUTH_SECRET: ci-only-${{ github.run_id }}-not-a-real-secret-value-xx
          AUTH_TRUST_HOST: "true"
      - name: Keep the browser report when it fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
