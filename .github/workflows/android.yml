# Android app (mobile/android, a Trusted Web Activity around the live site).
# - Pull requests touching the app: build a debug APK to prove it compiles (artifact, not for users).
# - Tag "android-vX.Y.Z" (or run manually with a version): build the signed release APK, attach it to a
#   GitHub Release and register it with the server, so the "Get woli on your phone" dialog offers it.
# Signing secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
# Registering: DESKTOP_RELEASE_TOKEN (same token the desktop releases use) and the vars below.
name: Android app

on:
  pull_request:
    paths: ["mobile/android/**", ".github/workflows/android.yml"]
  push:
    tags: ["android-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 1.0.0
        required: true

permissions:
  contents: read

env:
  APP_HOST: ${{ vars.ANDROID_APP_HOST || 'woli-work.vercel.app' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: Version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then v="${{ inputs.version }}"; release=true
          elif [ "${{ github.ref_type }}" = "tag" ]; then v="${GITHUB_REF_NAME#android-v}"; release=true
          else v="0.0.0-pr.${{ github.event.number }}"; release=false; fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then echo "::error::Invalid version '$v'"; exit 1; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.v.outputs.release }}" = "true" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set - a release must be signed with the app's key (docs/ANDROID.md)."; exit 1
          fi

      - name: Build
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.key.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          task=assembleDebug
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then task=assembleRelease; fi
          gradle -p mobile/android "$task" -PappVersion="${{ steps.v.outputs.value }}" -PappHost="$APP_HOST" --no-daemon --stacktrace
          apk=$(ls mobile/android/app/build/outputs/apk/*/*.apk | head -1)
          mkdir -p dist
          cp "$apk" "dist/woli-android-${{ steps.v.outputs.value }}.apk"
          sha256sum dist/*.apk
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs dist/*.apk | grep -i "SHA-256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: woli-android-${{ steps.v.outputs.value }}
          path: dist/*.apk
          retention-days: 14

      - name: GitHub Release
        if: steps.v.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.v.outputs.value }}
          name: woli Android ${{ steps.v.outputs.value }}
          files: dist/*.apk

      - uses: actions/setup-node@v7
        if: steps.v.outputs.release == 'true'
        with:
          node-version: "20"

      - name: Register release with the server
        if: steps.v.outputs.release == 'true'
        env:
          BASEWORK_SERVER_URL: https://${{ env.APP_HOST }}
          DESKTOP_RELEASE_TOKEN: ${{ secrets.DESKTOP_RELEASE_TOKEN }}
          RELEASE_PLATFORM: android
          RELEASE_VERSION: ${{ steps.v.outputs.value }}
          INSTALLER_PATH: dist/woli-android-${{ steps.v.outputs.value }}.apk
          INSTALLER_URL: https://github.com/${{ github.repository }}/releases/download/android-v${{ steps.v.outputs.value }}/woli-android-${{ steps.v.outputs.value }}.apk
          MIN_OS_VERSION: Android 7.0+
          RELEASE_NOTES: ${{ github.event.head_commit.message || '' }}
        run: |
          if [ -z "$DESKTOP_RELEASE_TOKEN" ]; then
            echo "::warning::DESKTOP_RELEASE_TOKEN secret not set - the APK is on the GitHub Release but not registered; add it in Admin console > Desktop releases (platform android)."
            exit 0
          fi
          node scripts/desktop/publish-release.mjs
