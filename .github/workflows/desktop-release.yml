# Publishes a desktop release. Trigger by pushing a tag "desktop-vX.Y.Z"
# (see docs/DESKTOP.md) or manually from the Actions tab - pick the TAG in
# "Use workflow from": the release environment refuses branches.
name: Desktop release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (must equal desktop/package.json), e.g. 1.2.0
        required: true
      channel:
        description: Release channel (beta for a trial release nobody is offered by default)
        type: choice
        options: [stable, beta]
        default: stable

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.v.outputs.value }}
    steps:
      - id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then v="$INPUT_VERSION"; else v="${GITHUB_REF_NAME#desktop-v}"; fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then echo "::error::Invalid version '$v'"; exit 1; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    # Only this job may write (GitHub Release); its secrets come from the release environment.
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-build.yml
    with:
      publish: true
      version: ${{ needs.version.outputs.value }}
      channel: ${{ inputs.channel || 'stable' }}
